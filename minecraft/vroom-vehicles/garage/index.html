<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vroom Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the 3D marina fills the screen; a spec card floats top-left, the
   fleet list docks right (a sheet on phones), controls sit along the bottom.
   One deliberate look: a harbour-at-dusk navy glass over the live scene. */
:root {
  --ink: #081625;
  --glass: rgba(8, 22, 37, 0.74);
  --glass-strong: rgba(8, 22, 37, 0.9);
  --line: rgba(170, 205, 232, 0.2);
  --fg: #eaf3fa;
  --muted: #9db4c7;
  --buoy: #ff6b3d;          /* life-ring orange: the one accent */
  --ready: #63e2a6;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--fg);
  font: 15px/1.45 var(--font-body);
  overflow: hidden;
}
.app { position: relative; height: 100%; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.panel {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
}

/* spec card */
.hud {
  position: absolute; top: 16px; left: 16px;
  width: min(300px, calc(100% - 32px));
  padding: 16px 18px 14px;
  display: grid; gap: 10px;
}
.eyebrow {
  font: 600 11px/1 var(--font-data);
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
h1 {
  margin: 0;
  font: 800 44px/0.9 var(--font-display);
  letter-spacing: 0.01em; text-transform: uppercase;
  text-wrap: balance;
}
.kind { margin: -4px 0 0; color: var(--muted); }
.specs { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; }
.hint b { color: var(--fg); font-weight: 600; }

.fleet-toggle {
  display: none;
  font: 600 11px/1 var(--font-data); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 10px; cursor: pointer;
}

/* fleet list */
.fleet {
  position: absolute; top: 16px; right: 16px; bottom: 112px;
  width: 280px; padding: 14px 0 6px;
  display: flex; flex-direction: column; min-height: 0;
}
.fleet header { padding: 0 16px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fleet h2 { margin: 0; font: 800 24px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; }
.fleet .count { font: 400 12px/1 var(--font-data); color: var(--muted); }
.fleet-scroll { overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
.group { margin: 8px 8px 4px; font: 600 10.5px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.fleet ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.row {
  width: 100%; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
  padding: 7px 8px; border-radius: 9px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font: inherit; font-size: 14px; text-align: left;
}
button.row { color: var(--fg); cursor: pointer; }
button.row:hover { background: rgba(255, 255, 255, 0.05); }
button.row[aria-current="true"] { border-color: var(--line); background: rgba(255, 255, 255, 0.07); }
.row .len { font: 400 12px/1 var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); }
.pill {
  font: 600 10px/1 var(--font-data); letter-spacing: 0.06em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.pill.ready { color: var(--ink); background: var(--ready); border-color: var(--ready); }

/* controls */
.dock {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  padding: 12px 14px;
  display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center;
}
.ctl { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ctl > span:first-child {
  font: 600 10.5px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.throttle { flex: 1 1 260px; }
#throttle { flex: 1; min-width: 120px; accent-color: var(--buoy); }
#speed { font: 600 13px/1 var(--font-data); font-variant-numeric: tabular-nums; min-width: 9.5ch; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button {
  font: 500 13px/1 var(--font-body); color: var(--muted); background: transparent;
  border: 0; border-radius: 999px; padding: 7px 11px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--buoy); outline-offset: 2px; }

.notice {
  position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
  padding: 9px 14px; font-size: 13px; max-width: calc(100% - 32px);
  background: var(--glass-strong); border: 1px solid var(--line); border-radius: 999px;
  transition: opacity 0.3s;
}
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

@media (max-width: 900px) {
  .fleet-toggle { display: inline-block; }
  .fleet {
    top: auto; left: 16px; right: 16px; bottom: 150px; width: auto; max-height: 52%;
    background: var(--glass-strong);
  }
  .fleet[data-open="false"] { display: none; }
  h1 { font-size: 36px; }
  .hud { gap: 8px; padding: 14px 16px 12px; }
  .specs, .hint { font-size: 12px; }
}
@media (max-width: 560px) {
  .dock { gap: 10px 14px; padding: 10px 12px; }
  .ctl.throttle { flex-basis: 100%; }
  .seg button { padding: 7px 9px; font-size: 12.5px; }
  .hud .specs { display: none; }
}
</style>
</head>
<body>


<div class="app">
  <canvas id="scene" aria-label="Live 3D preview of the selected vehicle on the water"></canvas>

  <section class="hud panel" aria-live="polite">
    <div class="eyebrow">
      <span>Vroom! Vehicles · Garage</span>
      <button class="fleet-toggle" id="fleetToggle" aria-controls="fleet" aria-expanded="false">Fleet 1/20</button>
    </div>
    <h1 id="name">Speedboat</h1>
    <p class="kind" id="kind">Runabout · water</p>
    <dl class="specs" id="specs"></dl>
    <p class="hint" id="hint"></p>
  </section>

  <aside class="fleet panel" id="fleet" data-open="false" aria-label="The fleet">
    <header><h2>The Fleet</h2><span class="count" id="count"></span></header>
    <div class="fleet-scroll" id="fleetList"></div>
  </aside>

  <div class="dock panel" role="group" aria-label="Preview controls">
    <label class="ctl throttle" for="throttle">
      <span>Throttle</span>
      <input id="throttle" type="range" min="0" max="100" value="45">
      <span id="speed">0.0 m/s</span>
    </label>
    <div class="ctl"><span>Camera</span>
      <div class="seg" id="cams">
        <button data-cam="orbit" aria-pressed="true">Orbit</button>
        <button data-cam="chase" aria-pressed="false">Chase</button>
        <button data-cam="side" aria-pressed="false">Side</button>
        <button data-cam="names" aria-pressed="false">Names</button>
      </div>
    </div>
    <div class="ctl"><span>Look</span>
      <div class="seg" id="looks">
        <button data-look="real" aria-pressed="true">Real</button>
        <button data-look="mc" aria-pressed="false">In-game</button>
      </div>
    </div>
    <div class="ctl"><span>Sky</span>
      <div class="seg" id="skies">
        <button data-sky="day" aria-pressed="true">Day</button>
        <button data-sky="sunset" aria-pressed="false">Sunset</button>
      </div>
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>// Turn a Bedrock .geo.json into a three.js object, the way Blockbench (and so
// Minecraft) shows it: x is mirrored, x/y rotations are flipped, and each
// face's texture reads left-to-right when you look at it from outside.
// Shared by tools/preview.js and the garage previewer. Expects global THREE.

(function (root) {
  const FACES = ["east", "west", "up", "down", "south", "north"];  // three's box order
  const rad = d => d * Math.PI / 180;
  // Minecraft shades faces by direction: top 100%, front/back 80%, sides 60%
  const MC_SHADE = [0.6, 0.6, 1.0, 0.5, 0.8, 0.8];

  const toBB = p => [-p[0], p[1], p[2]];
  const rotBB = r => [-rad(r[0]), -rad(r[1]), rad(r[2])];

  function cubeMesh(c, material, tw, th, mcShade) {
    const [w, h, d] = c.size;
    const g = new THREE.BoxGeometry(Math.max(w, .001), Math.max(h, .001), Math.max(d, .001));
    const uv = g.attributes.uv;
    FACES.forEach((f, i) => {
      const { uv: [u, v], uv_size: [su, sv] } = c.uv[f];
      [[0, 0], [1, 0], [0, 1], [1, 1]].forEach(([du, dv], k) =>
        uv.setXY(i * 4 + k, (u + du * su) / tw, 1 - (v + dv * sv) / th));
    });
    if (mcShade) {
      const col = [];
      for (let i = 0; i < 6; i++) for (let k = 0; k < 4; k++) col.push(MC_SHADE[i], MC_SHADE[i], MC_SHADE[i]);
      g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    }
    const center = toBB([c.origin[0] + w / 2, c.origin[1] + h / 2, c.origin[2] + d / 2]);
    const pivot = c.pivot ? toBB(c.pivot) : center;
    const holder = new THREE.Group();
    holder.position.set(...pivot);
    if (c.rotation) holder.rotation.set(...rotBB(c.rotation), "ZYX");
    const mesh = new THREE.Mesh(g, material);
    mesh.position.set(center[0] - pivot[0], center[1] - pivot[1], center[2] - pivot[2]);
    holder.add(mesh);
    return holder;
  }

  // Returns { model, bones } where bones[name] is the group to animate.
  // materials: { solid, glass } — bones named glass* use the glass one.
  function buildBedrockModel(geoJson, materials, { mcShade = false } = {}) {
    const geo = geoJson["minecraft:geometry"][0];
    const { texture_width: tw, texture_height: th } = geo.description;
    const groups = {}, model = new THREE.Group();
    for (const b of geo.bones) {
      const pivot = toBB(b.pivot || [0, 0, 0]);
      const outer = new THREE.Group(), animated = new THREE.Group(), inner = new THREE.Group();
      outer.position.set(...pivot);
      if (b.rotation) outer.rotation.set(...rotBB(b.rotation), "ZYX");
      inner.position.set(-pivot[0], -pivot[1], -pivot[2]);
      outer.add(animated); animated.add(inner);
      const mat = b.name.startsWith("glass") ? materials.glass : materials.solid;
      (b.cubes || []).forEach(c => inner.add(cubeMesh(c, mat, tw, th, mcShade)));
      groups[b.name] = { outer, animated, inner, bone: b };
    }
    for (const { outer, bone } of Object.values(groups)) {
      (bone.parent ? groups[bone.parent].inner : model).add(outer);
    }
    const bones = {};
    for (const [name, g] of Object.entries(groups)) bones[name] = g.animated;
    return { model, bones };
  }

  // Apply a Bedrock rotation (degrees, as written in animation files).
  function setBoneRotation(bone, r) {
    bone.rotation.set(...rotBB(r), "ZYX");
  }

  root.buildBedrockModel = buildBedrockModel;
  root.setBoneRotation = setBoneRotation;
})(typeof window !== "undefined" ? window : globalThis);
</script>

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 1, 8000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  const clamp = (x, a, b) => Math.min(Math.max(x, a), b);

  // --- waves: one definition shared by the water shader and the boat's bobbing
  const WAVES = [ // direction x, z, amplitude, wavelength, speed
    [1.0, 0.35, 0.75, 120, 0.9], [-0.45, 1.0, 0.45, 64, 1.25],
    [0.75, -0.65, 0.22, 33, 1.8], [0.15, 1.0, 0.12, 15, 2.6],
  ].map(([dx, dz, a, len, w]) => {
    const n = Math.hypot(dx, dz);
    return { dx: dx / n, dz: dz / n, a, k: 2 * Math.PI / len, w };
  });
  const WATER_Y = 3.5;
  let travelled = 0, time = 0;

  function waveHeight(x, z) {
    let h = 0;
    for (const v of WAVES) h += v.a * Math.sin((v.dx * x + v.dz * (z + travelled)) * v.k + time * v.w);
    return h;
  }
  const glslWaves = WAVES.map(v =>
    `acc(vec2(${v.dx.toFixed(4)}, ${v.dz.toFixed(4)}), ${v.a.toFixed(3)}, ${v.k.toFixed(5)}, ${v.w.toFixed(3)}, q, h, dh);`
  ).join("\n");

  const SKIES = {
    day: {
      top: 0x2f78d0, horizon: 0xbfdcf2, sun: [0.45, 0.62, -0.64], sunColor: 0xfff2d6,
      deep: 0x0b3d63, shallow: 0x1f7aa6, cloudLit: 0xffffff, cloudShade: 0xb7c6d6,
      light: 2.4, hemi: [0xcfe6ff, 0x1d4566, 0.75],
    },
    sunset: {
      top: 0x26386e, horizon: 0xf2a477, sun: [-0.62, 0.11, -0.78], sunColor: 0xffb26b,
      deep: 0x13223d, shallow: 0x43506e, cloudLit: 0xffc79a, cloudShade: 0x6b5a7a,
      light: 2.0, hemi: [0xffc49a, 0x221a33, 0.55],
    },
  };
  const U = {
    uTime: { value: 0 }, uOff: { value: 0 },
    uSunDir: { value: new THREE.Vector3() }, uSunColor: { value: new THREE.Color() },
    uSkyTop: { value: new THREE.Color() }, uSkyHorizon: { value: new THREE.Color() },
    uDeep: { value: new THREE.Color() }, uShallow: { value: new THREE.Color() },
    uCloudLit: { value: new THREE.Color() }, uCloudShade: { value: new THREE.Color() },
  };
  const NOISE = `float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }`;

  // --- sky dome with sun and drifting clouds
  const skyMat = new THREE.ShaderMaterial({
    uniforms: U, side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vDir;
      void main() { vDir = normalize(position);
        vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
    fragmentShader: `uniform float uTime, uOff; uniform vec3 uSunDir, uSunColor, uSkyTop, uSkyHorizon, uCloudLit, uCloudShade;
      varying vec3 vDir;
      ${NOISE}
      void main() {
        vec3 d = normalize(vDir); float y = d.y;
        vec3 col = mix(uSkyHorizon, uSkyTop, pow(clamp(y, 0.0, 1.0), 0.55));
        if (y < 0.0) col = uSkyHorizon * 0.92;
        float sd = max(dot(d, normalize(uSunDir)), 0.0);
        col += uSunColor * (pow(sd, 900.0) * 30.0 + pow(sd, 10.0) * 0.28);
        if (y > 0.0) {
          vec2 uv = d.xz / (y + 0.12) * 1.1 + vec2(uTime * 0.006, -uOff * 0.00004);
          float c = fbm(uv * 1.3);
          c = smoothstep(0.48, 0.82, c) * smoothstep(0.0, 0.22, y);
          float lit = fbm(uv * 1.3 + normalize(uSunDir).xz * 0.06);
          vec3 cloud = mix(uCloudShade, uCloudLit, clamp(0.55 + (c - lit) * 3.0 + sd * 0.4, 0.0, 1.0));
          col = mix(col, cloud, c * 0.92);
        }
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 48, 24), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

  // --- water: the same waves, a fresnel sky reflection and a sun glint
  const waterGeo = new THREE.PlaneGeometry(3200, 3200, 320, 320);
  waterGeo.rotateX(-Math.PI / 2);
  const waterMat = new THREE.ShaderMaterial({
    uniforms: U,
    vertexShader: `uniform float uTime, uOff; varying vec3 vPos, vN; varying float vH;
      void acc(vec2 d, float a, float k, float w, vec2 q, inout float h, inout vec2 dh) {
        float ph = dot(d, q) * k + uTime * w; h += a * sin(ph); dh += a * k * cos(ph) * d; }
      void main() {
        vec3 p = position; vec2 q = vec2(p.x, p.z + uOff); float h = 0.0; vec2 dh = vec2(0.0);
        ${glslWaves}
        p.y += h; vH = h; vN = normalize(vec3(-dh.x, 1.0, -dh.y));
        vec4 wp = modelMatrix * vec4(p, 1.0); vPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `uniform vec3 uSunDir, uSunColor, uSkyTop, uSkyHorizon, uDeep, uShallow;
      varying vec3 vPos, vN; varying float vH;
      void main() {
        vec3 N = normalize(vN), V = normalize(cameraPosition - vPos);
        float fres = 0.02 + 0.98 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
        vec3 R = reflect(-V, N);
        vec3 skyc = mix(uSkyHorizon, uSkyTop, pow(clamp(R.y, 0.0, 1.0), 0.55));
        vec3 body = mix(uDeep, uShallow, clamp(vH * 0.5 + 0.45, 0.0, 1.0));
        float spec = pow(max(dot(R, normalize(uSunDir)), 0.0), 240.0) * 5.0;
        vec3 col = mix(body, skyc, fres) + uSunColor * spec;
        float far = smoothstep(500.0, 1500.0, length(vPos.xz - cameraPosition.xz));
        col = mix(col, uSkyHorizon, far);
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`,
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.position.y = WATER_Y;
  scene.add(water);

  // --- ground: grass with a road (an airstrip for aircraft) that scrolls by
  const groundGeo = new THREE.PlaneGeometry(3200, 3200, 1, 1);
  groundGeo.rotateX(-Math.PI / 2);
  const groundMat = new THREE.ShaderMaterial({
    uniforms: { ...U, uRoad: { value: 40 } },
    vertexShader: `varying vec3 vPos;
      void main() { vec4 wp = modelMatrix * vec4(position, 1.0); vPos = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp; }`,
    fragmentShader: `uniform float uOff, uRoad; uniform vec3 uSkyHorizon, uSunColor; varying vec3 vPos;
      ${NOISE}
      void main() {
        float x = vPos.x, z = vPos.z + uOff;
        vec3 grass = mix(vec3(0.11, 0.22, 0.06), vec3(0.2, 0.33, 0.09), fbm(vec2(x, z) * 0.02));
        grass *= 0.85 + 0.3 * hash(floor(vec2(x, z) / 2.0));
        float road = step(abs(x), uRoad);
        vec3 asphalt = vec3(0.05, 0.055, 0.06) * (0.85 + 0.3 * hash(floor(vec2(x, z) * 2.0)));
        float dash = step(abs(x), 0.9) * step(fract(z / 56.0), 0.45);
        float edge = step(abs(abs(x) - (uRoad - 3.0)), 0.9);
        vec3 col = mix(grass, asphalt, road);
        col = mix(col, vec3(0.75, 0.6, 0.18), dash * road);
        col = mix(col, vec3(0.7), edge * road);
        col *= uSunColor * 1.2;
        float far = smoothstep(500.0, 1500.0, length(vPos.xz - cameraPosition.xz));
        gl_FragColor = vec4(mix(col, uSkyHorizon, far), 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  scene.add(ground);

  // --- lights for the realistic look
  const sun = new THREE.DirectionalLight(0xffffff, 2);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x223344, 0.7);
  scene.add(sun, hemi);

  // --- wake: foam particles that stream back from the hull and spread
  const WAKE_N = 5000;
  const wPos = new Float32Array(WAKE_N * 3), wAlpha = new Float32Array(WAKE_N), wSize = new Float32Array(WAKE_N);
  const wVel = new Float32Array(WAKE_N), wAge = new Float32Array(WAKE_N).fill(99), wLife = new Float32Array(WAKE_N);
  const wakeGeo = new THREE.BufferGeometry();
  wakeGeo.setAttribute("position", new THREE.BufferAttribute(wPos, 3));
  wakeGeo.setAttribute("aAlpha", new THREE.BufferAttribute(wAlpha, 1));
  wakeGeo.setAttribute("aSize", new THREE.BufferAttribute(wSize, 1));
  const wake = new THREE.Points(wakeGeo, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { uScale: { value: 1 } },
    vertexShader: `attribute float aAlpha, aSize; uniform float uScale; varying float vA;
      void main() { vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying float vA;
      void main() { float d = length(gl_PointCoord - 0.5); if (d > 0.5) discard;
        gl_FragColor = vec4(vec3(0.96, 0.98, 1.0), vA * smoothstep(0.5, 0.1, d)); }`,
  }));
  wake.frustumCulled = false;
  scene.add(wake);
  let wakeCursor = 0;
  function emit(x, z, vx, life, size) {
    const i = wakeCursor = (wakeCursor + 1) % WAKE_N;
    wPos[i * 3] = x; wPos[i * 3 + 2] = z; wVel[i] = vx; wAge[i] = 0; wLife[i] = life; wSize[i] = size;
  }

  // --- the shared paint atlas and its two looks
  const tex = new THREE.TextureLoader().load(DATA.atlas);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.magFilter = THREE.NearestFilter;
  const MATS = {
    mc: {
      solid: new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, vertexColors: true }),
      glass: new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, vertexColors: true }),
    },
    real: {
      solid: new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, roughness: 0.38, metalness: 0.05 }),
      glass: new THREE.MeshStandardMaterial({ map: tex, transparent: true, depthWrite: false, roughness: 0.04, metalness: 0.1 }),
    },
  };

  // --- the vehicle
  let vehicle = null;
  function loadVehicle(id) {
    const v = DATA.vehicles[id];
    const built = buildBedrockModel(v.geo, MATS.mc, { mcShade: true });
    built.model.traverse(o => { if (o.isMesh) o.userData.glass = o.material === MATS.mc.glass; });
    if (vehicle) scene.remove(vehicle.holder);
    const holder = new THREE.Group();
    holder.add(built.model);
    scene.add(holder);
    const box = new THREE.Box3().setFromObject(built.model);
    const center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    vehicle = { id, info: v.info, holder, bones: built.bones, acc: [], alt: 0, yaw: 0,
                box, center, size, reach: Math.max(size.x, size.z, size.y) };
    const mode = v.info.mode;
    water.visible = mode === "water" || mode === "seaplane";
    ground.visible = !water.visible;
    groundMat.uniforms.uRoad.value = mode === "air" ? 90 : 40;
    wAge.fill(99);
    controls.minDistance = vehicle.reach * 0.5;
    controls.maxDistance = vehicle.reach * 6 + 60;
    applyLook();
  }

  // --- controls and state
  const state = { throttle: 0.45, cam: "orbit", look: "real", sky: "day" };
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) state.throttle = 0;
  $("throttle").value = Math.round(state.throttle * 100);

  function applyLook() {
    if (!vehicle) return;
    const set = MATS[state.look];
    vehicle.holder.traverse(o => { if (o.isMesh) o.material = o.userData.glass ? set.glass : set.solid; });
    renderer.toneMappingExposure = state.look === "real" ? 0.95 : 0.9;
  }

  const pmrem = new THREE.PMREMGenerator(renderer);
  let envRT = null;
  function applySky() {
    const s = SKIES[state.sky];
    U.uSunDir.value.set(...s.sun).normalize();
    for (const [k, v] of [["uSunColor", s.sunColor], ["uSkyTop", s.top], ["uSkyHorizon", s.horizon],
      ["uDeep", s.deep], ["uShallow", s.shallow], ["uCloudLit", s.cloudLit], ["uCloudShade", s.cloudShade]]) {
      U[k].value.setHex(v).convertSRGBToLinear();
    }
    sun.position.copy(U.uSunDir.value).multiplyScalar(200);
    sun.color.setHex(s.sunColor); sun.intensity = s.light;
    hemi.color.setHex(s.hemi[0]); hemi.groundColor.setHex(s.hemi[1]); hemi.intensity = s.hemi[2];
    // reflections on the vehicle come from this sky
    const envScene = new THREE.Scene();
    envScene.add(new THREE.Mesh(sky.geometry, skyMat));
    if (envRT) envRT.dispose();
    envRT = pmrem.fromScene(envScene, 0.02);
    scene.environment = envRT.texture;
  }

  // cameras are directions from the vehicle's centre, scaled to its size
  const CAMS = {
    orbit: [0.67, 0.42, -0.6, 1.9],
    chase: [0, 0.38, 1, 2.3],
    side: [1, 0.12, 0, 1.6],
  };
  let camTween = null;
  function camTarget(name) {
    const v = vehicle, lift = v.holder.position.y;
    if (name === "names" && v.info.egg_cam) {
      const { eye, at } = v.info.egg_cam;
      return { eye: new THREE.Vector3(eye[0], eye[1] + lift, eye[2]), at: new THREE.Vector3(at[0], at[1] + lift, at[2]) };
    }
    const [dx, dy, dz, k] = CAMS[name] || CAMS.orbit;
    const at = v.center.clone(); at.y += lift;
    const dir = new THREE.Vector3(dx, dy, dz).normalize();
    // tall phone screens see less side to side, so pull the camera back
    const pull = camera.aspect < 1.1 ? Math.min(2.1, 1.2 / camera.aspect) : 1;
    return { eye: at.clone().addScaledVector(dir, (v.reach * k + 8) * pull), at };
  }
  function moveCamera(name, instant) {
    const t = camTarget(name);
    if (instant) { camera.position.copy(t.eye); controls.target.copy(t.at); camTween = null; return; }
    camTween = { t: 0, fromEye: camera.position.clone(), fromAt: controls.target.clone(), toEye: t.eye, toAt: t.at };
  }

  function pressGroup(groupId, attr, value) {
    for (const b of $(groupId).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset[attr] === value));
  }
  let foundNames = false;
  $("cams").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.cam = b.dataset.cam; pressGroup("cams", "cam", state.cam); moveCamera(state.cam);
    foundNames = false;
  });
  $("looks").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.look = b.dataset.look; pressGroup("looks", "look", state.look); applyLook();
  });
  $("skies").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.sky = b.dataset.sky; pressGroup("skies", "sky", state.sky); applySky();
  });
  $("throttle").addEventListener("input", e => { state.throttle = e.target.value / 100; });

  // --- fleet list and spec card
  const rows = DATA.fleet.flatMap(g => g.items);
  const ready = rows.filter(i => i.ready).length;
  $("count").textContent = `${ready} of ${rows.length} ready`;
  $("fleetToggle").textContent = `Fleet ${ready}/${rows.length}`;
  $("fleetList").innerHTML = DATA.fleet.map(g => `
    <p class="group">${g.group}</p>
    <ol>${g.items.map(i => i.ready
      ? `<li><button class="row" data-id="${i.id}" aria-current="false"><span>${i.name}</span><span class="len">${i.length} blk</span><span class="pill ready">Ready</span></button></li>`
      : `<li class="row"><span>${i.name}</span><span class="len">${i.length} blk</span><span class="pill">Planned</span></li>`
    ).join("")}</ol>`).join("");
  $("fleetList").addEventListener("click", e => {
    const b = e.target.closest("button.row"); if (!b) return;
    select(b.dataset.id);
    if (matchMedia("(max-width: 900px)").matches) {
      $("fleet").dataset.open = "false"; $("fleetToggle").setAttribute("aria-expanded", "false");
    }
  });
  $("fleetToggle").addEventListener("click", () => {
    const open = $("fleet").dataset.open !== "true";
    $("fleet").dataset.open = String(open);
    $("fleetToggle").setAttribute("aria-expanded", String(open));
  });

  const MODE_WORD = { water: "water", land: "land", air: "air", seaplane: "water and air" };
  function select(id) {
    const info = DATA.vehicles[id].info;
    $("name").textContent = info.name;
    $("kind").textContent = `${info.kind} · ${MODE_WORD[info.mode]}`;
    const specs = [...info.specs, ["Recipe", info.recipe_text]];
    $("specs").innerHTML = specs.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    $("hint").innerHTML = "LUNA and INDI are hidden on it. Tap <b>Names</b> to find them.";
    for (const b of document.querySelectorAll("button.row")) b.setAttribute("aria-current", String(b.dataset.id === id));
    loadVehicle(id);
    state.cam = "orbit"; pressGroup("cams", "cam", "orbit");
    moveCamera("orbit", true);
    foundNames = false;
  }

  // --- the same animation rules as the add-on's .animation.json files
  const AX = { x: 0, y: 1, z: 2 };
  function animate(v, dt, speed, yawSpeed, rider) {
    const rot = {};
    const add = (bone, axis, val) => { (rot[bone] = rot[bone] || [0, 0, 0])[AX[axis]] += val; };
    (v.info.anim || []).forEach((a, i) => {
      if (a.type === "lift") add(a.bone, "x", -clamp((speed - (a.offset || 0)) * a.k, 0, a.max));
      else if (a.type === "roll") {
        v.acc[i] = (v.acc[i] || 0) + speed * dt * 360 / (2 * Math.PI * a.radius / 16);
        add(a.bone, "x", v.acc[i]);
      } else if (a.type === "spin") {
        v.acc[i] = (v.acc[i] || 0) + dt * ((rider ? a.ridden || 0 : a.idle || 0) + speed * (a.per_speed || 0));
        add(a.bone, a.axis, v.acc[i]);
      } else if (a.type === "turn") add(a.bone, a.axis, clamp(yawSpeed * a.k, -a.max, a.max));
      else if (a.type === "bob") add(a.bone, a.axis, a.amp * Math.sin(time * a.freq * 2 * Math.PI));
    });
    for (const [b, r] of Object.entries(rot)) if (v.bones[b]) setBoneRotation(v.bones[b], r);
  }

  // --- size and animate
  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    // world-size points: pixels per unit at distance 1
    wake.material.uniforms.uScale.value = h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  }
  addEventListener("resize", resize);

  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    time += dt;
    const v = vehicle, info = v.info, mode = info.mode;
    // top speed in metres (blocks) per second, roughly what the add-on's speed gives
    const top = mode === "air" ? (info.fly_speed || 0.12) * 80 : (info.speed || 0.3) * 30;
    const rider = state.throttle > 0.02;
    const speed = state.throttle * top;
    travelled -= speed * 16 * dt;              // vehicles head to -z (16 px a block)
    U.uTime.value = time; U.uOff.value = travelled;
    $("speed").textContent = `${speed.toFixed(1)} m/s`;

    // a gentle weave, so bikes lean and front wheels steer
    const prevYaw = v.yaw;
    v.yaw = Math.sin(time * 0.55) * 0.16 * state.throttle;
    const yawSpeed = (v.yaw - prevYaw) / Math.max(dt, 1e-3) * 180 / Math.PI;

    // altitude: aircraft climb with the throttle, the seaplane above half throttle
    let altTarget = 0;
    if (mode === "air") altTarget = rider ? 24 + state.throttle * 110 : 0;
    if (mode === "seaplane") altTarget = state.throttle > 0.5 ? (state.throttle - 0.5) * 260 : 0;
    v.alt += (altTarget - v.alt) * Math.min(1, dt * 0.8);
    const prevY = v.holder.position.y;
    const onWater = (mode === "water" || mode === "seaplane") && v.alt < 2;
    let y = v.alt, pitch = 0, roll = 0;
    if (onWater) {
      // ride the swell: height at the middle, pitch end to end, roll side to side
      const half = v.size.z / 2, beam = Math.max(v.size.x / 2, 4), cz = v.center.z;
      const hBow = waveHeight(0, cz - half * 0.8), hStern = waveHeight(0, cz + half * 0.8);
      const hL = waveHeight(-beam, cz), hR = waveHeight(beam, cz);
      const damp = clamp(48 / v.size.z, 0.25, 1);
      y += waveHeight(0, cz) * 0.9 * damp;
      pitch = Math.atan2(hBow - hStern, half * 1.6) * 0.8;
      roll = Math.atan2(hR - hL, beam * 2) * 0.7 * damp;
    } else if (mode === "land") {
      y += Math.sin(time * 37) * 0.06 * state.throttle;     // engine and road buzz
    } else if (mode === "air" && v.alt > 1) {
      y += Math.sin(time * 0.9) * 1.2;                      // floating on the air
      roll = -v.yaw * 0.4;
    }
    v.holder.position.y = y;
    v.holder.rotation.set(pitch, v.yaw, roll, "YXZ");
    animate(v, dt, speed, yawSpeed, rider);
    // keep the camera with an aircraft as it climbs
    const dy = v.holder.position.y - prevY;
    if (!camTween) { camera.position.y += dy; controls.target.y += dy; }

    // wake from the stern corners, the stern, and the bow shoulders
    if (onWater && state.throttle > 0.02) {
      const r = state.throttle, b = v.box, hw = v.size.x * 0.45, stern = b.max.z, bow = b.min.z + v.size.z * 0.3;
      const k = Math.max(1, v.size.x / 20);
      for (let n = 0; n < Math.ceil(r * 4); n++) {
        const j = Math.random() - 0.5;
        emit(-hw + j * 2, stern - 2 + Math.random() * 3, -6 - r * 10, 2.6, (3 + r * 3) * k);
        emit(hw + j * 2, stern - 2 + Math.random() * 3, 6 + r * 10, 2.6, (3 + r * 3) * k);
        emit(j * hw, stern + 4 + Math.random() * 3, j * 6, 1.6, (4 + r * 4) * k);
        if (Math.random() < r) {
          emit(-hw * 0.9, bow + j * 6, -10 - r * 14, 1.8, 2.5 * k);
          emit(hw * 0.9, bow + j * 6, 10 + r * 14, 1.8, 2.5 * k);
        }
      }
    }
    for (let i = 0; i < WAKE_N; i++) {
      if (wAge[i] >= wLife[i]) { wAlpha[i] = 0; continue; }
      wAge[i] += dt;
      wPos[i * 3] += wVel[i] * dt;
      wPos[i * 3 + 2] += speed * 16 * dt;
      wPos[i * 3 + 1] = WATER_Y + waveHeight(wPos[i * 3], wPos[i * 3 + 2]) + 0.25;
      wAlpha[i] = (1 - wAge[i] / wLife[i]) * 0.75;
      wSize[i] *= 1 + dt * 0.6;
    }
    wakeGeo.attributes.position.needsUpdate = true;
    wakeGeo.attributes.aAlpha.needsUpdate = true;
    wakeGeo.attributes.aSize.needsUpdate = true;

    if (camTween) {
      camTween.t = Math.min(camTween.t + dt / 0.9, 1);
      const e = 1 - Math.pow(1 - camTween.t, 3);
      camera.position.lerpVectors(camTween.fromEye, camTween.toEye, e);
      controls.target.lerpVectors(camTween.fromAt, camTween.toAt, e);
      if (camTween.t === 1) camTween = null;
    }
    if (state.cam === "names" && !camTween && !foundNames) {
      foundNames = true;
      const n = $("notice"); n.textContent = `Found them: ${info.eggs}.`; n.hidden = false;
      clearTimeout(n._t); n._t = setTimeout(() => { n.hidden = true; }, 4200);
    }
    sky.position.copy(camera.position);
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  resize();
  applySky();
  const first = location.hash.slice(1);
  select(DATA.vehicles[first] ? first : rows.find(i => i.ready).id);
  requestAnimationFrame(frame);
})();
</script>
