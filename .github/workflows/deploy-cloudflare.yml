name: Deploy to Cloudflare

# Builds the johnnie site at the domain ROOT (no base path) and deploys the
# Cloudflare Worker (worker/index.js + johnnie/out assets + the contact-form
# email handler). Runs on every push to main, so johnnies.life always tracks
# the repo — same idea as the GitHub Pages workflow, but for the real domain.
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   - create via Cloudflare → My Profile → API Tokens →
#                            "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard → Workers & Pages (right side),
#                            or the hex id in the dashboard URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the darkroom bot pushes developed plates back
    steps:
      - uses: actions/checkout@v4

      # The darkroom bot: a CMS upload commits the RAW photo. Before
      # anything builds, extract its EXIF (capture data -> manifest),
      # reverse-geocode the place, then re-encode the plate at 1920px
      # with the metadata stripped. The build below uses the developed
      # tree, so production never serves a raw plate; the bot's push
      # (GITHUB_TOKEN) does not retrigger this workflow.
      - name: Darkroom bot
        run: |
          pip install --quiet pillow requests
          python3 scripts/darkroom_bot.py
          if ! git diff --quiet; then
            git config user.name "darkroom-bot"
            git config user.email "noreply@johnnies.life"
            git add johnnie/public/trips
            git commit -m "Darkroom bot: develop CMS-uploaded plates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: johnnie/package-lock.json

      # The badge bot: a CMS edit to badges.json only carries the emoji +
      # name. Vendor the Twemoji SVG the /badge/ page renders it from and
      # commit it back, so the repo stays the complete, self-hosted source
      # of truth. (npm's prebuild also runs this before every build, so the
      # deploy works even when this push fails.)
      - name: Badge bot
        run: |
          node johnnie/scripts/fetch-badge-glyphs.mjs
          if [ -n "$(git status --porcelain johnnie/public/badge/lib/twemoji)" ]; then
            git config user.name "badge-bot"
            git config user.email "noreply@johnnies.life"
            git add johnnie/public/badge/lib/twemoji
            git commit -m "Badge bot: vendor Twemoji glyphs for new badges"
            # A push race must not sink the deploy: the glyphs are already
            # committed locally, so this build ships them either way. Abort
            # any half-done rebase so the build never sees a conflicted tree.
            git pull --rebase origin main && git push origin HEAD:main || {
              git rebase --abort 2>/dev/null || true
              echo "::warning::badge bot could not push the vendored glyphs — they still ship in this build"
            }
          fi

      # Root build: DO NOT set PAGES_BASE_PATH — the domain serves from "/".
      - name: Build johnnie (root)
        working-directory: johnnie
        run: |
          npm ci
          npm run build

      # The playground: the terminal-view index at the repo root plus every
      # experiment, restored at johnnies.life/playground/ (it dropped off the
      # domain when it moved onto this Worker). Mirrors the GitHub Pages
      # staging list in deploy.yml, so deep links match the Pages site.
      - name: Build truco
        working-directory: truco
        run: |
          npm ci
          npm run build

      - name: Stage playground
        run: |
          mkdir -p johnnie/out/playground/truco
          cp index.html styles.css script.js johnnie/out/playground/
          cp -r truco/dist/. johnnie/out/playground/truco/
          for d in ascii cc dithered dots dott flyy generative-ui haiku jitter \
                   liquid liquid-glass-icon mask os piggies poetry pretext sizzle \
                   toaster tyme waves; do
            if [ -d "$d" ]; then
              cp -r "$d" "johnnie/out/playground/$d"
            fi
          done

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
